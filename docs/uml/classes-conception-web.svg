ion,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.2892" x="600.14" y="580.817">connect&#233; sans le r&#244;le ADMIN : erreur 403</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="85" id="ent0058"><path d="M6,526.5079 L6,589.626 A0,0 0 0 0 6,589.626 L148.05,589.626 L152.05,643.3679 L156.05,589.626 L298.1023,589.626 A0,0 0 0 0 298.1023,589.626 L298.1023,536.5079 L288.1023,526.5079 L6,526.5079 A0,0 0 0 0 6,526.5079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M288.1023,526.5079 L288.1023,536.5079 L298.1023,536.5079 L288.1023,526.5079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.7492" x="12" y="545.4049">Les trois filtres sont d&#233;clar&#233;s dans web.xml :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.4623" x="12" y="563.1109">l'ordre des filter-mapping (EncodingFilter,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.1023" x="12" y="580.817">AuthFilter, AdminFilter) est celui de la cha&#238;ne</text></g><!--link EncodingFilter to AuthFilter--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="46" id="lnk27"><path codeLine="46" d="M243.16,680.0679 C352.76,680.0679 530.66,680.0679 640.11,680.0679" fill="none" id="EncodingFilter-to-AuthFilter" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="646.11,680.0679,637.11,676.0679,641.11,680.0679,637.11,684.0679,646.11,680.0679" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.5362" x="329.1" y="675.9649">cha&#238;ne (ordre fix&#233; dans web.xml)</text></g><!--link EncodingFilter to AdminFilter--><g cla